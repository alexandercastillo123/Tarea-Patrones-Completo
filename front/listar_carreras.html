<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Carreras - SHENATI</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding-top: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #003366;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #0056b3;
            color: white;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background: #003d80;
        }

        .btn-delete {
            background: #dc3545;
        }

        .btn-edit {
            background: #ffc107;
            color: black;
        }

        /* Buscador */
        .search-container {
            margin: 20px 0;
            text-align: right;
        }

        #searchInput {
            width: 250px;
            border: 2px solid #003366;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #003366;
            color: white;
        }

        .back-link {
            display: block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al Panel</a>
        <h1>GESTIÓN DE CURSOS</h1>

        <form id="cursoForm">
            <input type="hidden" id="id_curso">
            <div class="form-group">
                <input type="text" id="nombre_curso" placeholder="Nombre del Curso" required>
                <select id="id_profesor" required>
                    <option value="">Cargando tutores...</option>
                </select>
                <select id="id_carrera" required style="grid-column: span 2;">
                    <option value="">Cargando carreras...</option>
                </select>
            </div>
            <button type="submit" class="btn" id="btnSubmit">Registrar Curso</button>
            <button type="button" class="btn" onclick="resetForm()" style="background:#6c757d">Limpiar</button>
        </form>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar curso..." onkeyup="filterTable()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Curso</th>
                    <th>ID Profesor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaCursos">
                <tr>
                    <td colspan="4">Cargando cursos...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadCursos();
            loadSelects();
        });

        async function loadSelects() {
            try {
                const [resP, resC] = await Promise.all([
                    fetch(`${API_URL}/profesores`),
                    fetch(`${API_URL}/carreras`)
                ]);
                const profs = await resP.json();
                const carrs = await resC.json();

                if (profs.success) {
                    document.getElementById('id_profesor').innerHTML = '<option value="">Seleccione Tutor</option>' +
                        profs.data.map(p => `<option value="${p.id_profesor}">${p.nombre_profesor}</option>`).join('');
                }
                if (carrs.success) {
                    document.getElementById('id_carrera').innerHTML = '<option value="">Seleccione Carrera</option>' +
                        carrs.data.map(c => `<option value="${c.id_carrera}">${c.nombre_carrera}</option>`).join('');
                }
            } catch (err) { console.error(err); }
        }

        async function loadCursos() {
            try {
                const res = await fetch(`${API_URL}/cursos`);
                const result = await res.json();
                if (result.success) {
                    const html = result.data.map(c => `
                        <tr>
                            <td>${c.id_curso}</td>
                            <td>${c.nombre_curso}</td>
                            <td>${c.id_profesor}</td>
                            <td>
                                <button class="btn btn-edit" onclick='editCurso(${JSON.stringify(c)})'>Editar</button>
                                <button class="btn btn-delete" onclick="deleteCurso(${c.id_curso})">Eliminar</button>
                            </td>
                        </tr>
                    `).join('');
                    document.getElementById('listaCursos').innerHTML = html || '<tr><td colspan="4">No hay cursos</td></tr>';
                }
            } catch (err) {
                document.getElementById('listaCursos').innerHTML = `<tr><td colspan="4" style="color:red">Error al cargar.</td></tr>`;
            }
        }

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const trs = document.getElementById('listaCursos').getElementsByTagName('tr');

            for (let i = 0; i < trs.length; i++) {
                const tds = trs[i].getElementsByTagName('td');
                if (tds.length === 0) continue;
                let found = false;
                for (let j = 0; j < tds.length - 1; j++) {
                    if (tds[j].textContent.toLowerCase().indexOf(filter) > -1) {
                        found = true;
                        break;
                    }
                }
                trs[i].style.display = found ? "" : "none";
            }
        }

        document.getElementById('cursoForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('id_curso').value;
            const data = {
                nombre_curso: document.getElementById('nombre_curso').value,
                id_profesor: parseInt(document.getElementById('id_profesor').value),
                id_carrera: parseInt(document.getElementById('id_carrera').value)
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/cursos/${id}` : `${API_URL}/cursos`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const resData = await res.json();
                if (resData.success) {
                    alert(resData.mensaje);
                    resetForm();
                    loadCursos();
                } else {
                    alert('Error: ' + resData.error);
                }
            } catch (err) { alert('Error en la petición'); }
        };

        function editCurso(c) {
            document.getElementById('id_curso').value = c.id_curso;
            document.getElementById('nombre_curso').value = c.nombre_curso;
            document.getElementById('id_profesor').value = c.id_profesor;
            document.getElementById('id_carrera').value = c.id_carrera;
            document.getElementById('btnSubmit').innerText = 'Actualizar Curso';
        }

        async function deleteCurso(id) {
            if (confirm('¿Eliminar curso?')) {
                try {
                    const res = await fetch(`${API_URL}/cursos/${id}`, { method: 'DELETE' });
                    const resData = await res.json();
                    if (resData.success) {
                        alert(resData.mensaje);
                        loadCursos();
                    }
                } catch (err) { alert('Error al eliminar'); }
            }
        }

        function resetForm() {
            document.getElementById('cursoForm').reset();
            document.getElementById('id_curso').value = '';
            document.getElementById('btnSubmit').innerText = 'Registrar Curso';
        }
    </script>
</body>

</html>
