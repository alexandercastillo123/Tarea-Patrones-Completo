<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHENATI</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding-top: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: rgb(0, 12, 65);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ffffff;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #0056b3;
            color: white;
            transition: 0.3s;
            text-decoration: none;
        }

        .btn:hover {
            background: #003d80;
        }

        .btn-login {
            background: #dc3545;
        }

        .btn-edit {
            background: #ffc107;
            color: black;
        }

        /* Buscador */
        .search-container {
            margin: 20px 0;
            text-align: right;
        }

        #searchInput {
            width: 250px;
            border: 2px solid #003366;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #003366;
            color: white;
        }

        .back-link {
            display: block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>
<div class="container"> <header><h1>SHENATI  - GESTION</h1></header>
    <div class="container">hola</div>
</div>
    

<button id="login">Iniciar Sesión</button>
<button id="register">Registrarme</button>

<body>
    
</body>
</html>
