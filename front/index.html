<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE GESTION - SENATI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 90%;
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            color: #003366;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .card {
            background: #fff;
            border: 1px solid #e1e8ed;
            padding: 40px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: #003366;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card:hover {
            background: #003366;
            color: #ffffff;
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 51, 102, 0.15);
            border-color: #003366;
        }

        .card-large {
            grid-column: 1 / -1;
            padding: 25px;
            background: #f8f9fb;
        }

        .card-large:hover {
            background: #004080;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">SENATI</div>
        <h1>Servicios Administrativos de Gestión</h1>

        <div class="menu-grid">
            <a href="listar_estudiantes.html" class="card">Gestionar Estudiantes</a>
            <a href="listar_profesores.html" class="card">Gestionar Profesores</a>
            <a href="listar_bloque.html" class="card">Gestionar Bloques</a>
            <a href="listar_cursos.html" class="card">Gestionar Cursos</a>
            <a href="listar_notas.html" class="card card-large">Registrar Calificaciones</a>
        </div>
    </div>
</body>

</html>
