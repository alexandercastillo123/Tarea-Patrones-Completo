<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Calificaciones - SENATI</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin: 0;
            padding-top: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #003366;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #0056b3;
            color: white;
            transition: 0.3s;
            text-decoration: none;
            display: block;
            width: 100%;
            font-size: 16px;
        }

        .btn:hover {
            background: #003d80;
        }

        .back-link {
            display: block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #0056b3;
            font-weight: bold;
        }

        .info-msg {
            padding: 15px;
            background: #e3f2fd;
            color: #0d47a1;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al Panel</a>
        <h1>REGISTRO DE CALIFICACIONES</h1>

        <div class="info-msg">
            Selecciona un estudiante y un curso para registrar su nota. El sistema evitará duplicados automáticamente.
        </div>

        <form id="notaForm">
            <div class="form-group">
                <div>
                    <label>Estudiante:</label>
                    <select id="id_estudiante" required>
                        <option value="">Cargando estudiantes...</option>
                    </select>
                </div>
                <div>
                    <label>Curso:</label>
                    <select id="id_curso" required>
                        <option value="">Cargando cursos...</option>
                    </select>
                </div>
                <div style="grid-column: span 2;">
                    <label>Nota Final (0-20):</label>
                    <input type="number" id="nota" placeholder="Ej: 18.5" min="0" max="20" step="0.1" required>
                </div>
            </div>
            <button type="submit" class="btn">Guardar Calificación</button>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', loadSelects);

        async function loadSelects() {
            try {
                const [resE, resC] = await Promise.all([
                    fetch(`${API_URL}/estudiantes`),
                    fetch(`${API_URL}/cursos`)
                ]);
                const ests = await resE.json();
                const curs = await resC.json();

                if (ests.success) {
                    document.getElementById('id_estudiante').innerHTML = '<option value="">Seleccione Estudiante</option>' +
                        ests.data.map(e => `<option value="${e.id_estudiante}">${e.nombre_estudiante} ${e.apellido_estudiante}</option>`).join('');
                }
                if (curs.success) {
                    document.getElementById('id_curso').innerHTML = '<option value="">Seleccione Curso</option>' +
                        curs.data.map(c => `<option value="${c.id_curso}">${c.nombre_curso}</option>`).join('');
                }
            } catch (err) { console.error(err); }
        }

        document.getElementById('notaForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                id_estudiante: parseInt(document.getElementById('id_estudiante').value),
                id_curso: parseInt(document.getElementById('id_curso').value),
                nota: parseFloat(document.getElementById('nota').value)
            };

            try {
                const res = await fetch(`${API_URL}/notas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const resData = await res.json();
                if (resData.success) {
                    alert('¡Nota registrada con éxito!');
                    document.getElementById('notaForm').reset();
                } else {
                    alert('Error: ' + resData.error);
                }
            } catch (err) { alert('Error en la petición'); }
        };
    </script>
</body>

</html>
