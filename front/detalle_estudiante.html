<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Expediente del Estudiante - SHENATI</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
        }

        .dossier {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #003366;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content {
            padding: 40px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-left: 5px solid #0056b3;
            border-radius: 4px;
        }

        .info-item strong {
            display: block;
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-item span {
            font-size: 17px;
            color: #003366;
            font-weight: bold;
        }

        h2 {
            border-bottom: 2px solid #003366;
            padding-bottom: 10px;
            color: #003366;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f0f4f8;
            color: #003366;
            font-weight: bold;
        }

        .nota-high {
            color: #28a745;
            font-weight: bold;
        }

        .nota-low {
            color: #dc3545;
            font-weight: bold;
        }

        .footer {
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .btn-back {
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0056b3;
            padding: 10px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #0056b3;
            color: white;
        }
    </style>
</head>

<body>

    <div class="dossier">
        <div class="header">
            <h1 id="estNombre">Expediente SENATI</h1>
        </div>

        <div class="content">
            <h2>Información General</h2>
            <div class="info-grid">
                <div class="info-item">
                    <strong>Nombre Completo</strong>
                    <span id="estNombre">-</span>
                </div>
                <div class="info-item">
                    <strong>Carrera Técnica</strong>
                    <span id="estudianteCarrera">Cargando...</span>
                </div>
                <div class="info-item">
                    <strong>Documento (DNI)</strong>
                    <span id="estudianteDni">-</span>
                </div>
                <div class="info-item">
                    <strong>ID Estudiante</strong>
                    <span id="estudianteId">-</span>
                </div>
            </div>

            <h2>Rendimiento Académico</h2>
            <table>
                <thead>
                    <tr>
                        <th>Materia / Curso</th>
                        <th>Calificación</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="listaNotas">
                    <tr>
                        <td colspan="3">Consultando historial...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <a href="listar_estudiantes.html" class="btn-back">Volver al Listado de Estudiantes</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!id) return alert('ID de estudiante no proporcionado');

            try {
                // 1. Obtener datos del estudiante y carreras
                const [resE, resC] = await Promise.all([
                    fetch(`${API_URL}/estudiantes`),
                    fetch(`${API_URL}/carreras`)
                ]);
                const dataE = await resE.json();
                const dataC = await resC.json();

                const est = dataE.data.find(e => e.id_estudiante == id);
                if (est) {
                    document.getElementById('estNombre').innerText = `${est.nombre_estudiante} ${est.apellido_estudiante}`;
                    document.getElementById('estudianteDni').innerText = est.dni_estudiante;
                    document.getElementById('estudianteId').innerText = est.id_estudiante;

                    const carrera = dataC.data.find(c => c.id_carrera == est.id_carrera);
                    document.getElementById('estudianteCarrera').innerText = carrera ? carrera.nombre_carrera : 'No asignada';
                }

                // 2. Obtener sus notas (ahora el backend trae el nombre del curso)
                const resN = await fetch(`${API_URL}/estudiantes/${id}/notas`);
                const resultN = await resN.json();

                if (resultN.success && resultN.data.length > 0) {
                    const html = resultN.data.map(n => {
                        const classNota = n.nota >= 10.5 ? 'nota-high' : 'nota-low';
                        const estado = n.nota >= 10.5 ? 'Aprobado' : 'Desaprobado';
                        return `
                            <tr>
                                <td>${n.nombre_curso}</td>
                                <td class="${classNota}">${n.nota}</td>
                                <td><span class="${classNota}">${estado}</span></td>
                            </tr>
                        `;
                    }).join('');
                    document.getElementById('listaNotas').innerHTML = html;
                } else {
                    document.getElementById('listaNotas').innerHTML = '<tr><td colspan="3">Sin calificaciones registradas.</td></tr>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('listaNotas').innerHTML = '<tr><td colspan="3">Error al conectar con la base de datos.</td></tr>';
            }
        });
    </script>
</body>

</html>
